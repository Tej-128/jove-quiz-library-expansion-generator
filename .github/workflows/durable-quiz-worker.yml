name: Durable Quiz Batch Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: jove-durable-quiz-worker
  cancel-in-progress: false

jobs:
  process-queued-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process one durable quiz job
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python worker/durable_worker.py
